name: CI
env:
  PYTHON_VERSION: '3.12'
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.12.7
    - name: Install dependencies
      run: uv sync --locked --all-extras
    - name: Local CI contract lint
      run: bash scripts/ci.sh lint
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: energy_rag_test
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: testpass
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U rag -d energy_rag_test" --health-interval 5s --health-timeout 3s --health-retries
          10
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.12.7
    - name: Install dependencies
      run: uv sync --locked --all-extras
    - name: Wait for PostgreSQL
      run: "for i in {1..30}; do\n  pg_isready -h localhost -p 5432 -U rag -d energy_rag_test && break\n  sleep 2\ndone\npg_isready -h localhost -p 5432 -U rag -d energy_rag_test\n"
    - name: Run database migrations
      run: 'PGPASSWORD=testpass psql -v ON_ERROR_STOP=1 -h localhost -U rag -d energy_rag_test -f sql/init.sql

        '
    - name: Local CI contract test
      run: bash scripts/ci.sh test
      env:
        TEST_DATABASE_URL: postgresql+asyncpg://rag:testpass@localhost:5432/energy_rag_test
        EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    - name: Upload coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
      with:
        files: ./coverage.xml
'on':
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  workflow_call: {}
