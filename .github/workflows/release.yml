name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: energy_rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d energy_rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U rag -d energy_rag && break
            sleep 2
          done

      - name: Run database migrations
        run: |
          PGPASSWORD=testpass psql -h localhost -U rag -d energy_rag -f sql/init.sql

      - name: Run tests
        run: uv run pytest --cov=src/energy_rag --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://rag:testpass@localhost:5432/energy_rag
          EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2

      - name: Build package
        run: uv build

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*