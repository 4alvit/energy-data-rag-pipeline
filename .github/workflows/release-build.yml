name: Build release assets
'on':
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
permissions:
  contents: read
jobs:
  native:
    name: Native ${{ matrix.product }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        product: [rag, fcc]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install Ubuntu-signed local image transport
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes skopeo
      - name: Build and smoke the exact native OCI image
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          PRODUCT: ${{ matrix.product }}
          ARCH: ${{ matrix.arch }}
        run: >-
          python3 scripts/native_containers.py build --version "$VERSION" --channel "$CHANNEL"
          --product "$PRODUCT" --arch "$ARCH" --output native-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-cell-${{ matrix.product }}-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: native-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  package:
    name: Assemble checked native assets
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-cell-rag-amd64-attempt-${{ github.run_attempt }}
          path: native-inputs/rag-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-cell-rag-arm64-attempt-${{ github.run_attempt }}
          path: native-inputs/rag-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-cell-fcc-amd64-attempt-${{ github.run_attempt }}
          path: native-inputs/fcc-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-cell-fcc-arm64-attempt-${{ github.run_attempt }}
          path: native-inputs/fcc-arm64
      - name: Assemble exact candidate assets without rebuilding
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: >-
          python3 scripts/native_containers.py assemble --version "$VERSION" --channel "$CHANNEL"
          --inputs native-inputs --output release-dist
      - name: Verify all artifact checksums
        working-directory: release-dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-attempt-${{ github.run_attempt }}
          path: release-dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
