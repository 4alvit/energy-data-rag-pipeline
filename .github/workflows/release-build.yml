name: Build release assets
'on':
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      release_plan_artifact:
        description: Frozen plan from the release allocator; empty only for native PR validation
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native:
    name: Native ${{ matrix.product }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        product: [rag, fcc]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Download frozen release version plan
        if: ${{ inputs.release_plan_artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: .
      - name: Apply frozen release version inputs
        if: ${{ inputs.release_plan_artifact != '' }}
        run: python3 scripts/version_plan.py sync --root . --plan .release-plan.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install Ubuntu-signed local image transport
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes skopeo
      - name: Build and smoke the exact native OCI image
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          PRODUCT: ${{ matrix.product }}
          ARCH: ${{ matrix.arch }}
        run: >-
          python3 scripts/native_containers.py build --version "$VERSION" --channel "$CHANNEL"
          --product "$PRODUCT" --arch "$ARCH" --output native-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-cell-${{ matrix.product }}-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: native-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  package:
    name: Assemble checked native assets
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Download frozen release version plan
        if: ${{ inputs.release_plan_artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: .
      - name: Apply frozen release version inputs
        if: ${{ inputs.release_plan_artifact != '' }}
        run: python3 scripts/version_plan.py sync --root . --plan .release-plan.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-cell-rag-amd64-attempt-${{ github.run_attempt }}
          path: native-inputs/rag-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-cell-rag-arm64-attempt-${{ github.run_attempt }}
          path: native-inputs/rag-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-cell-fcc-amd64-attempt-${{ github.run_attempt }}
          path: native-inputs/fcc-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-cell-fcc-arm64-attempt-${{ github.run_attempt }}
          path: native-inputs/fcc-arm64
      - name: Assemble exact candidate assets without rebuilding
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: >-
          python3 scripts/native_containers.py assemble --version "$VERSION" --channel "$CHANNEL"
          --inputs native-inputs --output release-dist
      - name: Verify all artifact checksums
        working-directory: release-dist
        run: sha256sum --check SHA256SUMS
      - name: Verify and stage versioned release assets
        if: ${{ inputs.release_plan_artifact != '' }}
        run: python3 scripts/stage_release_assets.py --target package --pattern 'release-dist/*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ inputs.release_plan_artifact != '' && 'release-assets/package/*' || 'release-dist/*' }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
