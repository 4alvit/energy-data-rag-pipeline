# Generated by venus-os-ci-toolkit/scripts/install_release.py; edit .release-policy.json.
name: Deploy k3s
permissions:
  contents: read
jobs:
  checks:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: ./.github/workflows/quality-gate.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  deploy:
    name: Apply energy-rag to k3s
    runs-on: ubuntu-latest
    steps:
    - name: Require explicit stable deployment version
      env:
        DEPLOY_TAG: ${{ inputs.tag }}
      run: |
        python3 - <<'PYVERSION'
        import os,re
        if not re.fullmatch(r'(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)', os.environ['DEPLOY_TAG']):
            raise SystemExit('Deploy requires an approved stable X.Y.Z image, never latest/beta/rc')
        PYVERSION
    - name: Harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install deployment verification tools
      run: |-
        sudo apt-get update
        sudo apt-get install -y skopeo
        python3 -m pip install PyYAML==6.0.3
    - name: Require protected production environment
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'gh api "repos/$GITHUB_REPOSITORY/environments/production" --jq ''.protection_rules | any(.type == "required_reviewers"
        and (.reviewers | length > 0))'' | python3 -c ''import sys; assert sys.stdin.read().strip() == "true", "Configure
        production required reviewers before deployment"'' '
    - name: Verify stable registry bytes against RC evidence
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: python3 scripts/verified_images.py --tag "v$TAG" --output "$RUNNER_TEMP/verified-images.json"
    - name: Setup kubectl
      uses: azure/setup-kubectl@911ae5630d033486b4382f7ce3a3375d2b2f7383
      with:
        version: v1.31.4
    - name: Write kubeconfig
      env:
        KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
      run: "mkdir -p \"$HOME/.kube\"\n# Secret may be raw YAML or base64 \u2014 detect\nif printf '%s' \"$KUBECONFIG_B64\"\
        \ | head -c 20 | grep -q 'apiVersion'; then\n  printf '%s\\n' \"$KUBECONFIG_B64\" > \"$HOME/.kube/config\"\
        \nelse\n  printf '%s' \"$KUBECONFIG_B64\" | base64 --decode > \"$HOME/.kube/config\"\nfi\nchmod 600 \"$HOME/.kube/config\"\
        \nunset KUBECONFIG_B64\n"
    - name: Ensure namespace + secrets
      env:
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      run: |
        set -euo pipefail
        kubectl get ns energy-rag >/dev/null 2>&1 || kubectl create namespace energy-rag
        # Never echo secret values
        kubectl -n energy-rag create secret generic energy-rag-secrets \
          --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
          --from-literal=DATABASE_URL="postgresql+asyncpg://rag:${POSTGRES_PASSWORD}@postgres:5432/energy_rag" \
          --from-literal=OPENAI_API_KEY="${OPENAI_API_KEY:-}" \
          --from-literal=ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY:-}" \
          --from-literal=NVIDIA_NIM_API_KEY="${NVIDIA_NIM_API_KEY:-}" \
          --dry-run=client -o yaml | kubectl apply -f -
        echo "Secret keys present:"
        kubectl -n energy-rag get secret energy-rag-secrets -o jsonpath='{.data}' \
          | python3 -c "import sys,json; print(' '.join(json.load(sys.stdin).keys()))"
    - name: Apply + rollout
      env:
        TAG: ${{ inputs.tag }}
        VERIFIED_IMAGES_FILE: ${{ runner.temp }}/verified-images.json
        ACME_EMAIL: ${{ vars.ACME_EMAIL }}
        DNS_ZONE: ${{ vars.DNS_ZONE }}
        K3S_DNS_SUFFIX: ${{ vars.K3S_DNS_SUFFIX }}
        MCP_INGRESS_HOST: ${{ vars.MCP_INGRESS_HOST }}
      run: bash deploy/k3s/deploy.sh
    environment: production
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: checks
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: read
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Exact approved stable image version (X.Y.Z)
        required: true
