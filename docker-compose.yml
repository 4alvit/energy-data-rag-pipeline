services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: energy-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: energy_rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d energy_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/4alvit/energy-data-rag-pipeline:${TAG:-latest}
    container_name: energy-rag-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:${POSTGRES_PASSWORD:-changeme}@postgres:5432/energy_rag
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data:/data
    ports:
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Raw-socket HTTP probe — see deploy/docker-compose.prod.yml for why.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',8000)); s.sendall(b'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n'); d=s.recv(64); s.close(); raise SystemExit(0 if b' 200 ' in d else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/4alvit/energy-data-rag-pipeline:${TAG:-latest}
    container_name: energy-rag-mcp
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command:
      ["energy-rag-mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8800"]
    environment:
      RAG_API_URL: http://api:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${MCP_PORT:-8800}:8800"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('localhost',8800),timeout=3); s.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
