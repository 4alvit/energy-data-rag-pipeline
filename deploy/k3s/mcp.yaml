apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: energy-rag
  labels:
    app: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: mcp
          image: ghcr.io/4alvit/energy-data-rag-pipeline:latest
          args:
            - energy-rag-mcp
            - --transport
            - streamable-http
            - --host
            - 0.0.0.0
            - --port
            - "8800"
          ports:
            - containerPort: 8800
              name: http
          env:
            - name: RAG_API_URL
              valueFrom:
                configMapKeyRef:
                  name: energy-rag-config
                  key: RAG_API_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: energy-rag-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8800
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 8800
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: energy-rag
spec:
  selector:
    app: mcp
  ports:
    - port: 8800
      targetPort: 8800
      name: http
