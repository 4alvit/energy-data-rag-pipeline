apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: energy-rag
  labels:
    app: mcp
spec:
  replicas: 1
  # Include scheduling time in addition to the bounded startup probe.
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      # The descheduler must not evict this MP service to an ineligible node.
      nodeSelector:
        kubernetes.io/hostname: mp
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          image: ghcr.io/4alvit/energy-data-rag-pipeline@sha256:3a653ea52bf28ee2a5cd351e7270ee6595d0129f9c79098aca1bcd14eeae54dc
          args:
            - energy-rag-mcp
            - --transport
            - streamable-http
            - --host
            - 0.0.0.0
            - --port
            - "8800"
          ports:
            - containerPort: 8800
              name: http
          env:
            - name: RAG_API_URL
              valueFrom:
                configMapKeyRef:
                  name: energy-rag-config
                  key: RAG_API_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: energy-rag-config
                  key: LOG_LEVEL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          # Cold startup measured about four minutes on the contended MP node.
          startupProbe:
            tcpSocket:
              port: 8800
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8800
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 8800
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: energy-rag
spec:
  selector:
    app: mcp
  ports:
    - port: 8800
      targetPort: 8800
      name: http
