apiVersion: v1
kind: ConfigMap
metadata:
  name: energy-rag-config
  namespace: energy-rag
data:
  POSTGRES_DB: energy_rag
  POSTGRES_USER: rag
  LOG_LEVEL: INFO
  EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
  # No local Ollama in this setup — use Free Claude Code (FCC) as Anthropic-compatible proxy.
  LLM_PROVIDER: anthropic
  LLM_MODEL: claude-3-5-sonnet-20241022
  LLM_BASE_URL: http://fcc:8082
  # Placeholder only (provider unused). Do not invent LAN IPs here.
  OLLAMA_BASE_URL: http://127.0.0.1:11434
  RAG_API_URL: http://api:8000
  FCC_HOST: "0.0.0.0"
  FCC_PORT: "8082"
  FCC_OPEN_BROWSER: "false"
  MESSAGING_PLATFORM: none
