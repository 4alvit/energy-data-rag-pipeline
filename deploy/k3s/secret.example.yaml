# Example only — do NOT commit real values.
# Create the live secret with:
#   kubectl -n energy-rag create secret generic energy-rag-secrets \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://rag:...@postgres:5432/energy_rag' \
#     --from-literal=OPENAI_API_KEY='' \
#     --from-literal=ANTHROPIC_API_KEY='' \
#     --from-literal=NVIDIA_NIM_API_KEY=''
#
# Optional FCC provider keys (same secret or separate fcc-secrets):
#   NVIDIA_NIM_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY, ...
apiVersion: v1
kind: Secret
metadata:
  name: energy-rag-secrets
  namespace: energy-rag
type: Opaque
stringData:
  POSTGRES_PASSWORD: changeme
  DATABASE_URL: postgresql+asyncpg://rag:changeme@postgres:5432/energy_rag
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  NVIDIA_NIM_API_KEY: ""
