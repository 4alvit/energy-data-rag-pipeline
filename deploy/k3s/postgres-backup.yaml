apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-logical-backup
  namespace: energy-rag
data:
  backup.sh: |
    #!/bin/sh
    set -eu
    umask 077
    # This dedicated PVC contains only this application's backup directory.
    test ! -L /backups/energy-rag
    mkdir -p /backups/energy-rag
    chmod 700 /backups/energy-rag
    cd /backups/energy-rag
    stamp=$(date -u +%Y%m%dT%H%M%SZ)
    final="energy-rag-$stamp.dump"
    test ! -e "$final"
    partial=".$final.partial"
    set -C
    : > "$partial"
    set +C
    receipt_partial=".$final.sha256.partial"
    trap 'rm -f "$partial" "$receipt_partial"' EXIT HUP INT TERM
    pg_dump --format=custom --file="$partial"
    # Parse/decompress the complete dump without executing its SQL.
    pg_restore --file=/dev/null "$partial"
    chmod 600 "$partial"
    hash_line=$(sha256sum "$partial")
    expected=${hash_line%% *}
    sync -f "$partial"
    mv "$partial" "$final"
    # Read the published NAS file again. The checksum receipt is the completion
    # marker and appears only after this readback succeeds.
    hash_line=$(sha256sum "$final")
    actual=${hash_line%% *}
    test "$actual" = "$expected"
    printf "%s  %s\n" "$expected" "$final" > "$receipt_partial"
    sync -f "$receipt_partial"
    mv "$receipt_partial" "$final.sha256"
    sync -f .
    # Retain every successful backup for at least 14 days. No PVC or unrelated
    # path is deleted; only this dedicated directory's exact owned file pattern.
    find . -maxdepth 1 -type f -name 'energy-rag-????????T??????Z.dump*' -mtime +14 -delete
    printf 'Verified logical database backup completed.\n'
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-logical-backup
  namespace: energy-rag
spec:
  schedule: "20 10 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: postgres-logical-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: mp
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
              command: [sh, /scripts/backup.sh]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - {name: PGHOST, value: postgres.energy-rag.svc.cluster.local}
                - {name: PGPORT, value: "5432"}
                - {name: PGCONNECT_TIMEOUT, value: "15"}
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef: {name: energy-rag-config, key: POSTGRES_DB}
                - name: PGUSER
                  valueFrom:
                    configMapKeyRef: {name: energy-rag-config, key: POSTGRES_USER}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: energy-rag-secrets, key: POSTGRES_PASSWORD}
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: "1", memory: 256Mi}
              volumeMounts:
                - {name: backups, mountPath: /backups}
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: backups
              persistentVolumeClaim: {claimName: postgres-backups-nfs-v1}
            - name: scripts
              configMap: {name: postgres-logical-backup, defaultMode: 0444}
            - name: tmp
              emptyDir: {}
