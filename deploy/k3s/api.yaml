apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: energy-rag
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/4alvit/energy-data-rag-pipeline:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: energy-rag-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: energy-rag-secrets
                  key: DATABASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: energy-rag-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: energy-rag-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: hf-cache
              mountPath: /app/.cache
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: energy-rag-data
        - name: hf-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: energy-rag
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
