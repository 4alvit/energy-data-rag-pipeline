apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp
  namespace: energy-rag
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - energy-rag.k3s.example.com
      secretName: energy-rag-k3s-tls
  rules:
    - host: energy-rag.k3s.example.com
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  number: 8800
