# Production stack for Synology / NAS deployment.
# Pulls prebuilt multi-arch images from GHCR - no build step on the NAS.
#
# Usage (on the Synology via SSH):
#   export TAG=<version>            # e.g. v0.2.0
#   sudo docker compose -f deploy/docker-compose.prod.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: energy-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: energy_rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${DATA_ROOT:-/volume1/docker/energy-rag}/pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d energy_rag"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    image: ghcr.io/4alvit/energy-data-rag-pipeline:${TAG:-latest}
    container_name: energy-rag-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:${POSTGRES_PASSWORD}@postgres:5432/energy_rag
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://192.168.1.50:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ${DATA_ROOT:-/volume1/docker/energy-rag}/data:/data
      - hf_cache:/app/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      # Raw-socket HTTP probe: urllib's import chain costs ~1.3s of CPU per
      # probe on NAS ARM (~13% of a core at a 10-15s interval). A bare socket
      # does the same GET /health (incl. DB ping) in ~0.35s.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',8000)); s.sendall(b'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n'); d=s.recv(64); s.close(); raise SystemExit(0 if b' 200 ' in d else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      # First boot downloads the embedding models (~100 MB); slow NAS disks
      # can exceed several minutes before /health answers.
      start_period: 600s

  mcp:
    image: ghcr.io/4alvit/energy-data-rag-pipeline:${TAG:-latest}
    container_name: energy-rag-mcp
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command:
      ["energy-rag-mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8800"]
    environment:
      RAG_API_URL: http://api:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${MCP_PORT:-8800}:8800"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('localhost',8800),timeout=3); s.close()",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  fcc:
    image: ghcr.io/4alvit/free-claude-code:${TAG:-latest}
    container_name: energy-rag-fcc
    restart: unless-stopped
    # Host networking is deliberate: FCC's Admin UI rejects any request whose
    # client IP or Origin header is not loopback (hardcoded local-only guard).
    # With host networking an SSH tunnel (`ssh -L 8082:127.0.0.1:8082 nas`)
    # presents genuine loopback, so `http://localhost:8082/admin` works from
    # a workstation while LAN clients can reach only the proxy endpoints.
    network_mode: host
    environment:
      HOST: 0.0.0.0
      PORT: ${FCC_PORT:-8082}
      FCC_OPEN_BROWSER: "false"
      MESSAGING_PLATFORM: none
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Provider credentials come from ./fcc.env (uploaded by deploy.sh;
    # container env takes precedence over the Admin UI's stored ~/.fcc/fcc.env).
    env_file:
      - ./fcc.env
    volumes:
      - fcc_config:/home/fcc/.fcc
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('localhost',${FCC_PORT:-8082}),timeout=3); s.close()",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  hf_cache:
  fcc_config:
